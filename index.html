<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loops & Love</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(12px);
    border-radius:24px;
    padding:45px 35px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.18);
    animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    font-size:3rem;
    margin-bottom:10px;
}

h1{
    color:#2d2d2d;
    font-size:2.4rem;
    margin-bottom:15px;
    font-weight:700;
}

.subtitle{
    color:#666;
    font-size:1.05rem;
    line-height:1.8;
    margin-bottom:30px;
}

.permanent-link{
    background:#f7f7ff;
    border-left:5px solid #667eea;
    padding:18px;
    border-radius:14px;
    margin-bottom:30px;
    word-break:break-word;
    font-size:0.95rem;
    color:#333;
    font-weight:500;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    justify-content:center;
    margin-top:10px;
}

.btn{
    text-decoration:none;
    padding:14px 24px;
    border-radius:14px;
    font-weight:600;
    transition:0.3s ease;
    display:inline-block;
    font-size:0.95rem;
}

.email-btn{
    background:#667eea;
    color:white;
}

.email-btn:hover{
    background:#5569d8;
    transform:translateY(-2px);
}

.whatsapp-btn{
    background:#25D366;
    color:white;
}

.whatsapp-btn:hover{
    background:#1ebe5d;
    transform:translateY(-2px);
}

.footer{
    margin-top:30px;
    color:#888;
    font-size:0.85rem;
}

.timestamp{
    margin-top:8px;
    font-size:0.8rem;
}

@media(max-width:768px){

    .container{
        padding:35px 22px;
    }

    h1{
        font-size:2rem;
    }

    .logo{
        font-size:2.5rem;
    }

    .subtitle{
        font-size:0.98rem;
    }

    .buttons{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">💜</div>

    <h1>Loops & Love</h1>

    <p class="subtitle">
        Welcome to Loops & Love — a beautifully crafted space made with creativity,
        elegance, and modern design.
    </p>

    <div class="permanent-link">
        https://chikkihere.github.io/Loopsandlove/
    </div>

    <div class="buttons">

        <!-- EMAIL BUTTON -->
        <a 
        class="btn email-btn"
        href="mailto:loopswithlov3@gmail.com?subject=Loops%20and%20Love%20Request">
        SEND MY REQUEST
        </a>

        <!-- WHATSAPP BUTTON -->
        <a 
        class="btn whatsapp-btn"
        href="https://wa.me/919930369899"
        target="_blank"
        rel="noopener noreferrer">
        WhatsApp Us
        </a>

    </div>

    <div class="footer">
        Crafted with love ✨
        <div class="timestamp">
            Created on: <span id="createdDate"></span>
        </div>
    </div>

</div>

<script>
document.getElementById('createdDate').textContent =
new Date().toLocaleDateString('en-IN', {
    day:'numeric',
    month:'long',
    year:'numeric'
});
</script>

</body>
</html>
